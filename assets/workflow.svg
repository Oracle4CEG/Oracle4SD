<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720">
<title>Scientific data project workflow</title>
<desc>Six stages connect sources to analysis. Validation spans the workflow. The bundled example is synthetic; project evidence remains for the author.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker></defs>
<rect width="1440" height="720" rx="28" fill="#080b1a"/>
<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="60" y="70" font-size="34" font-weight="bold" fill="#f8fafc">Scientific data project template</text>
<text x="60" y="112" font-size="22" fill="#aab4d0">Follow each record from its source to an interpretable, testable output.</text>
<text x="60" y="152" font-size="18" fill="#fbbf24">BUNDLED DATA: SYNTHETIC TEACHING EXAMPLE</text>
<g fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow)">
<path d="M 440 254 H 514"/><path d="M 910 254 H 984"/><path d="M 1190 318 V 374"/>
<path d="M 1000 454 H 926"/><path d="M 530 454 H 456"/></g>
<rect x="60" y="190" width="380" height="128" rx="16" fill="#111d33" stroke="#425175"/>
<text x="84" y="235" font-size="26" font-weight="bold" fill="#f8fafc">1  Data sources</text>
<text x="84" y="278" font-size="17" fill="#aab4d0">Provenance and permitted inputs</text>
<rect x="530" y="190" width="380" height="128" rx="16" fill="#111d33" stroke="#425175"/>
<text x="554" y="235" font-size="26" font-weight="bold" fill="#f8fafc">2  Query code</text>
<text x="554" y="278" font-size="17" fill="#aab4d0">Acquisition and checksums</text>
<rect x="1000" y="190" width="380" height="128" rx="16" fill="#111d33" stroke="#425175"/>
<text x="1024" y="235" font-size="26" font-weight="bold" fill="#f8fafc">3  Queried data</text>
<text x="1024" y="278" font-size="17" fill="#aab4d0">Raw records and retrieval log</text>
<rect x="1000" y="390" width="380" height="128" rx="16" fill="#111d33" stroke="#425175"/>
<text x="1024" y="435" font-size="26" font-weight="bold" fill="#f8fafc">4  Process code</text>
<text x="1024" y="478" font-size="17" fill="#aab4d0">Rules, lineage and exclusions</text>
<rect x="530" y="390" width="380" height="128" rx="16" fill="#111d33" stroke="#425175"/>
<text x="554" y="435" font-size="26" font-weight="bold" fill="#f8fafc">5  Processed data</text>
<text x="554" y="478" font-size="17" fill="#aab4d0">Records, dictionary and version</text>
<rect x="60" y="390" width="380" height="128" rx="16" fill="#111d33" stroke="#425175"/>
<text x="84" y="435" font-size="26" font-weight="bold" fill="#f8fafc">6  Analysis outputs</text>
<text x="84" y="478" font-size="17" fill="#aab4d0">Description with explicit scope</text>
<rect x="60" y="566" width="1320" height="104" rx="16" fill="#0d292d" stroke="#34d399"/>
<text x="84" y="604" font-size="23" font-weight="bold" fill="#34d399">Technical validation across every stage</text>
<text x="84" y="640" font-size="19" fill="#f8fafc">The author supplies scientific evidence. Software and metadata checks have a defined, limited scope.</text>
</g></svg>
